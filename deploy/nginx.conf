# Site statique exporté par Next.js (out/). Écoute sur 8080 (image nginx non privilégiée).

# Formulaire de contact : 10 requêtes par minute et par adresse IP au plus
# (le service applique en plus 5 messages par tranche de 15 minutes).
limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;

server {
    # IPv4 uniquement : une ligne « listen [::]:8080; » ferait échouer nginx sur un hôte sans IPv6.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm font/woff text/plain;

    # Fichiers versionnés par le build : cache long.
    location /_next/static/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Relais vers le service d'envoi (conteneur « contact », voir compose.yaml).
    # Résolution DNS à la requête (resolver Docker) : nginx démarre même si le
    # service est arrêté ; le formulaire affiche alors une erreur et l'adresse email.
    location = /api/contact {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        limit_except POST { deny all; }
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contact_upstream http://contact:3001;
        proxy_pass $contact_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/conf.d/security-headers.inc;
        internal;
    }
}
