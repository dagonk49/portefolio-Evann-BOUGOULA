# Site statique exporté par Next.js (out/). Écoute sur 8080 (image nginx non privilégiée).
server {
    # IPv4 uniquement : une ligne « listen [::]:8080; » ferait échouer nginx sur un hôte sans IPv6.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm font/woff text/plain;

    # Fichiers versionnés par le build : cache long.
    location /_next/static/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/conf.d/security-headers.inc;
        internal;
    }
}
